<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 · 经典版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .game-container {
            background: #263340;
            padding: 30px 40px 35px;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #b7d0e8;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 0 6px 14px 6px;
        }

        .score-row span {
            background: #1e2a36;
            padding: 4px 20px;
            border-radius: 60px;
            color: #f0c674;
            font-weight: 700;
            font-size: 22px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #1e2a36;
            border-radius: 18px;
            box-shadow: inset 0 0 0 1px #3a4a5a, 0 12px 24px rgba(0,0,0,0.5);
            width: 400px;
            height: 400px;
        }

        .status-area {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        #statusMsg {
            color: #b7d0e8;
            font-size: 15px;
            background: #1e2a36;
            padding: 6px 22px;
            border-radius: 60px;
            min-width: 120px;
        }

        #restartBtn {
            background: #3f5b78;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #1f3140;
        }

        #restartBtn:hover {
            background: #537a9e;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1f3140;
        }

        #restartBtn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1f3140;
        }

        .hint {
            color: #6c859e;
            font-size: 13px;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        /* 手机触屏优化 */
        @media (max-width: 480px) {
            .game-container {
                padding: 18px 16px 22px;
                border-radius: 24px;
            }
            canvas {
                width: 300px;
                height: 300px;
            }
            .score-row {
                font-size: 15px;
            }
            .score-row span {
                font-size: 18px;
                padding: 2px 16px;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 得分 -->
    <div class="score-row">
        <span>🍎 <span id="scoreDisplay">0</span></span>
        <span>🏆 <span id="highScoreDisplay">0</span></span>
    </div>

    <!-- 画布 -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- 控制区 -->
    <div class="status-area">
        <div id="statusMsg">▶ 按方向键开始</div>
        <button id="restartBtn">🔄 新一局</button>
    </div>
    <div class="hint">⬆⬇⬅➡ 方向键控制 &nbsp;·&nbsp; 按空格快速重开</div>
</div>

<script>
    (function(){
        // ----- 配置 -----
        const GRID_SIZE = 20;          // 20x20 网格
        const CELL_SIZE = 20;          // 像素
        const TICK_INTERVAL = 160;     // 毫秒

        // ----- DOM 引用 -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const highScoreSpan = document.getElementById('highScoreDisplay');
        const statusMsg = document.getElementById('statusMsg');

        // ----- 游戏状态 -----
        let snake = [];               // 坐标数组 [{x, y}, ...]
        let direction = 'RIGHT';      // 当前移动方向
        let nextDirection = 'RIGHT';  // 下一次移动实际方向
        let food = { x: 8, y: 10 };
        let score = 0;
        let highScore = 0;
        let gameOver = false;
        let winFlag = false;          // 是否胜利（格子占满）
        let gameInterval = null;
        let gameRunning = false;

        // 防止页面加载时自动开始移动（等待第一次按键）
        let gameStarted = false;

        // ----- 初始化 / 重置 -----
        function initGame() {
            // 蛇：初始长度为 3，水平放置
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            gameOver = false;
            winFlag = false;
            gameStarted = false;
            clearInterval(gameInterval);
            gameInterval = null;
            gameRunning = false;

            // 读本地最高分
            try {
                const saved = localStorage.getItem('snake_high_score');
                if (saved) highScore = parseInt(saved, 10) || 0;
                else highScore = 0;
            } catch (e) { highScore = 0; }

            updateScoreDisplay();
            generateFood();       // 随机生成食物
            statusMsg.textContent = '▶ 按方向键开始';
            drawCanvas();
        }

        // ----- 生成食物（避开蛇身）-----
        function generateFood() {
            const totalCells = GRID_SIZE * GRID_SIZE;
            if (snake.length >= totalCells) {
                // 胜利：格子全占满
                winFlag = true;
                gameOver = true;
                gameRunning = false;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                statusMsg.textContent = '🎉 你赢了！完美通关！';
                return;
            }

            const snakeSet = new Set(snake.map(s => `${s.x},${s.y}`));
            if (snakeSet.size >= totalCells) {
                winFlag = true;
                gameOver = true;
                gameRunning = false;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                statusMsg.textContent = '🎉 你赢了！完美通关！';
                return;
            }

            let newFood = null;
            let attempts = 0;
            while (attempts < 2000) {
                const fx = Math.floor(Math.random() * GRID_SIZE);
                const fy = Math.floor(Math.random() * GRID_SIZE);
                if (!snakeSet.has(`${fx},${fy}`)) {
                    newFood = { x: fx, y: fy };
                    break;
                }
                attempts++;
            }
            // 极低概率找不到位置（理论上蛇未满就一定有空位）
            if (!newFood) {
                for (let i = 0; i < GRID_SIZE; i++) {
                    let found = false;
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (!snakeSet.has(`${i},${j}`)) {
                            newFood = { x: i, y: j };
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }
            if (newFood) {
                food = newFood;
            } else {
                // 真的满了 -> 胜利
                winFlag = true;
                gameOver = true;
                gameRunning = false;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                statusMsg.textContent = '🎉 你赢了！完美通关！';
            }
        }

        // ----- 核心移动逻辑 -----
        function moveSnake() {
            if (gameOver || !gameStarted) return;

            // 采纳有效方向（不能掉头）
            const opposite = {
                'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT'
            };
            if (nextDirection && opposite[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // 计算新蛇头
            const head = snake[0];
            let newHead = { ...head };
            switch (direction) {
                case 'RIGHT': newHead.x += 1; break;
                case 'LEFT':  newHead.x -= 1; break;
                case 'UP':    newHead.y -= 1; break;
                case 'DOWN':  newHead.y += 1; break;
                default: return;
            }

            // 检查是否吃到食物
            const isEating = (newHead.x === food.x && newHead.y === food.y);

            // 构造新蛇 (先加头)
            let newSnake = [newHead, ...snake];

            if (!isEating) {
                // 没吃到：移除尾部
                newSnake.pop();
            }

            // ----- 碰撞检测 -----
            const headCollision = (() => {
                // 撞墙
                if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    return true;
                }
                // 撞自身 (忽略第一个，即新蛇头本身)
                for (let i = 1; i < newSnake.length; i++) {
                    if (newSnake[i].x === newHead.x && newSnake[i].y === newHead.y) {
                        return true;
                    }
                }
                return false;
            })();

            if (headCollision) {
                // 游戏结束
                gameOver = true;
                gameRunning = false;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                statusMsg.textContent = '💀 游戏结束！按「新一局」重来';
                drawCanvas();
                updateScoreDisplay();
                return;
            }

            // 更新蛇
            snake = newSnake;

            // 处理吃到食物
            if (isEating) {
                score++;
                if (score > highScore) {
                    highScore = score;
                    try {
                        localStorage.setItem('snake_high_score', String(highScore));
                    } catch (e) {}
                }
                updateScoreDisplay();
                generateFood();   // 可能触发胜利
                if (winFlag || gameOver) {
                    drawCanvas();
                    return;
                }
            }

            // 重绘
            drawCanvas();
            updateScoreDisplay();

            // 如果游戏在移动中胜利（generateFood内设置gameOver），停止循环
            if (gameOver) {
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                    gameRunning = false;
                }
                statusMsg.textContent = winFlag ? '🎉 你赢了！完美通关！' : '💀 游戏结束！按「新一局」重来';
            }
        }

        // ----- 渲染 -----
        function drawCanvas() {
            ctx.clearRect(0, 0, 400, 400);

            // 绘制网格线（浅暗线）
            ctx.strokeStyle = '#2b3b4a';
            ctx.lineWidth = 0.6;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, 400);
                ctx.stroke();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(400, i * CELL_SIZE);
                ctx.stroke();
            }

            // 绘制食物
            ctx.shadowColor = '#f0c674';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#f2594b';
            ctx.beginPath();
            ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 绘制蛇
            snake.forEach((seg, idx) => {
                const isHead = (idx === 0);
                const x = seg.x * CELL_SIZE, y = seg.y * CELL_SIZE;
                ctx.fillStyle = isHead ? '#6fcf97' : '#27ae60';
                ctx.shadowColor = isHead ? '#6fcf97' : '#1e8449';
                ctx.shadowBlur = isHead ? 12 : 6;

                // 圆角矩形
                const radius = 4;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, radius);
                ctx.fill();

                // 蛇头眼睛（小点缀）
                if (isHead) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0e2a1a';
                    const eyeOff = 5;
                    let ex1, ey1, ex2, ey2;
                    switch (direction) {
                        case 'RIGHT': ex1=x+12, ey1=y+4, ex2=x+12, ey2=y+12; break;
                        case 'LEFT':  ex1=x+4, ey1=y+4, ex2=x+4, ey2=y+12; break;
                        case 'UP':    ex1=x+4, ey1=y+4, ex2=x+12, ey2=y+4; break;
                        case 'DOWN':  ex1=x+4, ey1=y+12, ex2=x+12, ey2=y+12; break;
                        default: ex1=x+12, ey1=y+4, ex2=x+12, ey2=y+12;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 2.5, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, 2.5, 0, 2*Math.PI);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;

            // 如果游戏结束，叠加一层半透明遮罩文字
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#f2f7fb';
                ctx.font = 'bold 26px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const msg = winFlag ? '🏆 完美通关' : '💀 游戏结束';
                ctx.fillText(msg, 200, 200);
            }
        }

        // 工具：Canvas roundRect
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ----- UI 更新 -----
        function updateScoreDisplay() {
            scoreSpan.textContent = score;
            highScoreSpan.textContent = highScore;
        }

        // ----- 启动游戏循环（由第一次按键触发）-----
        function startGameLoop() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            if (!gameOver && gameStarted) {
                gameRunning = true;
                gameInterval = setInterval(() => {
                    moveSnake();
                }, TICK_INTERVAL);
            }
        }

        // ----- 处理键盘事件 -----
        function handleKeydown(e) {
            const key = e.key;
            // 阻止页面滚动 / 空格触发弹窗
            if (key.startsWith('Arrow') || key === ' ' || key === 'Spacebar') {
                e.preventDefault();
            }

            // 空格键：快捷重开
            if (key === ' ' || key === 'Spacebar') {
                restartGame();
                return;
            }

            // 方向键
            let newDir = null;
            if (key === 'ArrowUp') newDir = 'UP';
            else if (key === 'ArrowDown') newDir = 'DOWN';
            else if (key === 'ArrowLeft') newDir = 'LEFT';
            else if (key === 'ArrowRight') newDir = 'RIGHT';
            else return;

            // 如果游戏未开始（第一次按键），启动
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                statusMsg.textContent = '▶ 游戏中...';
                // 设置方向
                direction = newDir;
                nextDirection = newDir;
                startGameLoop();
                return;
            }

            // 游戏已结束则不响应方向
            if (gameOver) return;

            // 设置方向（防掉头由 moveSnake 处理）
            const opposite = {
                'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT'
            };
            if (opposite[newDir] !== direction) {
                nextDirection = newDir;
            }
        }

        // ----- 重新开始 -----
        function restartGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            gameRunning = false;
            initGame();
            // 重置后等待按键
        }

        // ----- 挂载事件 & 启动 -----
        window.addEventListener('load', () => {
            initGame();
            window.addEventListener('keydown', handleKeydown);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
        });

        // 防页面离开时定时器继续（优化）
        window.addEventListener('beforeunload', function() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        });

    })();
</script>

</body>
</html>
